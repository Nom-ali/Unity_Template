<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rolling Ball Shop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root { --ink:#08162B; --night:#061B3A; --navy:#0A3A75; --cobalt:#126AD1; --aqua:#19C5D8; --lime:#C8F53D; --orange:#FF9F1C; --coral:#FF5B6E; --white:#F9FCFF; --muted:#38516B; }
    body { margin:0; background:#0a1321; }
    .screen { position:relative; width:1080px; min-height:1920px; overflow:hidden; padding:44px 52px 54px; color:var(--white); background:radial-gradient(circle at 50% 8%, #145fc1 0, #082c62 32%, var(--night) 74%); font-family:"Nunito Sans",sans-serif; }
    .screen::before,.screen::after { content:""; position:absolute; border-radius:50%; pointer-events:none; }
    .screen::before { width:760px; height:760px; right:-310px; top:540px; border:42px solid rgba(25,197,216,.08); }
    .screen::after { width:440px; height:440px; left:-245px; top:1180px; border:28px solid rgba(200,245,61,.08); }
    .header { position:relative; z-index:1; height:144px; display:grid; grid-template-columns:110px 1fr 202px; align-items:center; }
    .back { width:98px; height:98px; display:grid; place-items:center; border:5px solid var(--ink); border-radius:24px; color:white; background:#1b4e91; box-shadow:0 10px 0 rgba(0,0,0,.32); }
    .back iconify-icon { font-size:59px; }
    .shop-title,.section-title,.item-title { font-family:"Baloo 2",sans-serif; font-weight:800; color:var(--white); text-shadow:0 5px 0 var(--ink), 0 8px 14px rgba(0,0,0,.25); }
    .shop-title { justify-self:center; margin-top:-4px; font-size:82px; line-height:1; letter-spacing:.5px; }
    .wallet { justify-self:end; display:flex; align-items:center; gap:13px; font-size:38px; font-weight:900; text-shadow:0 3px 0 var(--ink); }
    .orb { width:66px; height:66px; display:grid; place-items:center; border:4px solid var(--ink); border-radius:50%; color:var(--ink); background:var(--lime); box-shadow:inset 0 -9px rgba(0,0,0,.12),0 5px 0 rgba(0,0,0,.28); }
    .orb iconify-icon { font-size:38px; }
    .spark { position:absolute; z-index:0; font-size:32px; color:var(--lime); opacity:.8; text-shadow:0 3px 0 var(--ink); }
    .s1{top:182px;left:92px}.s2{top:274px;right:78px}.s3{top:720px;left:30px}.s4{top:1060px;right:38px}.s5{bottom:130px;left:110px}
    .section { position:relative; z-index:1; margin-top:23px; }
    .section-title { height:70px; display:flex; align-items:center; justify-content:center; border:4px solid rgba(7,17,30,.48); border-radius:17px; background:#0b4c8d; font-size:44px; letter-spacing:.4px; box-shadow:0 8px 0 rgba(1,11,27,.32); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:28px; padding:27px 6px 4px; }
    .purchase { position:relative; min-height:316px; overflow:hidden; padding:19px 18px 86px; border:5px solid var(--ink); border-radius:32px; color:var(--ink); text-align:center; box-shadow:0 13px 0 rgba(0,0,0,.30); font:inherit; cursor:pointer; }
    .purchase:active,.back:active { transform:translateY(4px); box-shadow:0 6px 0 rgba(0,0,0,.30); }
    .boost-turbo { background:linear-gradient(145deg,#1f80e3,#19c5d8); }
    .boost-shield { background:linear-gradient(145deg,#134e9e,#6176e8); }
    .coins-small { background:linear-gradient(145deg,#ffdb45,#ff9f1c); }
    .coins-large { background:linear-gradient(145deg,#c8f53d,#6fbc36); }
    .purchase::before { content:""; position:absolute; inset:11px; border:2px solid rgba(255,255,255,.37); border-radius:23px; pointer-events:none; }
    .item-title { position:relative; z-index:1; font-size:39px; line-height:1; }
    .benefit { position:relative; z-index:1; margin-top:4px; color:var(--white); font-size:20px; font-weight:900; text-shadow:0 2px 0 rgba(8,22,43,.52); }
    .art { position:relative; height:170px; margin-top:7px; display:flex; align-items:center; justify-content:center; }
    .ball { position:absolute; width:122px; height:122px; border:7px solid var(--ink); border-radius:50%; background:radial-gradient(circle at 34% 27%,white 0 7%,var(--lime) 8% 17%,#1a9dc2 18% 46%,#0a3574 47% 100%); box-shadow:inset -15px -18px rgba(0,0,0,.22),0 9px 0 rgba(0,0,0,.22); }
    .ball::before,.ball::after { content:""; position:absolute; border-radius:50%; background:rgba(255,255,255,.42); }
    .ball::before { width:13px;height:13px;left:27px;top:26px }.ball::after { width:7px;height:7px;left:48px;top:21px }
    .trail { position:absolute; width:150px; height:28px; transform:rotate(-21deg) translateX(-74px); border-radius:99px; background:var(--lime); box-shadow:0 0 0 5px var(--ink), -43px 0 0 -4px var(--aqua), -83px 0 0 -9px var(--aqua); }
    .shield { position:absolute; width:126px; height:142px; display:grid; place-items:center; border:7px solid var(--ink); clip-path:polygon(50% 0,92% 18%,84% 76%,50% 100%,16% 76%,8% 18%); background:linear-gradient(145deg,var(--aqua),#2056c1); box-shadow:0 9px 0 rgba(0,0,0,.24); }
    .shield iconify-icon { font-size:71px; color:var(--lime); filter:drop-shadow(0 4px 0 var(--ink)); }
    .bolt { position:absolute; right:53px; top:18px; color:#fff6a7; font-size:77px; text-shadow:3px 5px 0 var(--ink); transform:rotate(10deg); }
    .coin { position:absolute; width:106px; height:106px; display:grid; place-items:center; border:6px solid var(--ink); border-radius:50%; color:var(--orange); background:#fff470; box-shadow:inset -10px -12px rgba(224,128,0,.19),0 8px 0 rgba(0,0,0,.24); }
    .coin iconify-icon { font-size:58px; filter:drop-shadow(0 3px 0 rgba(8,22,43,.3)); }
    .c1{transform:translate(-88px,29px) rotate(-18deg)}.c2{transform:translate(0,-12px)}.c3{transform:translate(87px,31px) rotate(17deg)}.c4{transform:translate(46px,4px) scale(.84)}.c5{transform:translate(-37px,13px) scale(.76)}
    .price { position:absolute; z-index:2; bottom:0; left:0; width:100%; min-height:72px; display:flex; align-items:center; justify-content:center; border-top:4px solid var(--ink); background:var(--orange); color:var(--ink); font-family:"Baloo 2",sans-serif; font-size:48px; font-weight:800; line-height:1; text-shadow:0 2px 0 rgba(255,255,255,.32); }
    .noads { margin:27px 6px 0; min-height:228px; display:grid; grid-template-columns:240px 1fr; align-items:center; padding:19px 26px 81px; border:5px solid var(--ink); border-radius:32px; background:linear-gradient(115deg,#19c5d8,#126ad1); color:var(--ink); box-shadow:0 13px 0 rgba(0,0,0,.30); font:inherit; text-align:left; cursor:pointer; }
    .noads::before { content:""; position:absolute; inset:11px; border:2px solid rgba(255,255,255,.4); border-radius:22px; }
    .ad-art { position:relative; width:172px; height:130px; display:grid; place-items:center; }
    .ad-badge { position:absolute; width:118px; height:88px; display:grid; place-items:center; border:6px solid var(--ink); border-radius:21px; color:white; background:var(--coral); font-size:39px; font-weight:900; transform:rotate(-8deg); box-shadow:0 8px 0 rgba(0,0,0,.24); }
    .slash { position:absolute; z-index:2; width:167px; height:19px; border:4px solid var(--ink); border-radius:99px; background:var(--lime); transform:rotate(-39deg); }
    .ad-copy { position:relative; z-index:1; align-self:center; }
    .ad-copy .item-title { font-size:53px; }.ad-copy .benefit { color:var(--white); font-size:25px; }
    .noads .price { min-height:69px; font-size:45px; background:var(--lime); }
    .footer-note { position:relative; z-index:1; margin-top:38px; color:#a9c0de; text-align:center; font-size:20px; font-weight:800; }
    @media (max-width:1080px) { .screen { transform-origin:top left; } }
  </style>
</head>
<body>
  <div class="screen">
    <div class="spark s1">✦</div><div class="spark s2">✦</div><div class="spark s3">✦</div><div class="spark s4">✦</div><div class="spark s5">✦</div>
    <header class="header">
      <button class="back" aria-label="Back"><iconify-icon icon="solar:alt-arrow-left-bold"></iconify-icon></button>
      <div class="shop-title">Shop</div>
      <div class="wallet"><span class="orb"><iconify-icon icon="solar:star-bold"></iconify-icon></span><span>820</span></div>
    </header>
    <section class="section" aria-labelledby="boost-heading">
      <div class="section-title" id="boost-heading">Boost Packs</div>
      <div class="grid">
        <button class="purchase boost-turbo" aria-label="Buy Turbo Bundle for 2.49 dollars"><div class="item-title">Turbo Bundle</div><div class="benefit">3 speed boosts</div><div class="art"><div class="trail"></div><div class="ball"></div><div class="bolt">ϟ</div></div><div class="price">$2.49</div></button>
        <button class="purchase boost-shield" aria-label="Buy Shield Bundle for 3.49 dollars"><div class="item-title">Shield Bundle</div><div class="benefit">5 crash shields</div><div class="art"><div class="shield"><iconify-icon icon="solar:shield-check-bold"></iconify-icon></div><div class="ball" style="transform:translate(72px,41px) scale(.56)"></div></div><div class="price">$3.49</div></button>
      </div>
    </section>
    <section class="section" aria-labelledby="coin-heading">
      <div class="section-title" id="coin-heading">Coin Vault</div>
      <div class="grid">
        <button class="purchase coins-small" aria-label="Buy Coin Stack for 1.99 dollars"><div class="item-title">Coin Stack</div><div class="benefit">600 game coins</div><div class="art"><div class="coin c1"><iconify-icon icon="solar:star-bold"></iconify-icon></div><div class="coin c2"><iconify-icon icon="solar:star-bold"></iconify-icon></div><div class="coin c3"><iconify-icon icon="solar:star-bold"></iconify-icon></div></div><div class="price">$1.99</div></button>
        <button class="purchase coins-large" aria-label="Buy Coin Cache for 4.99 dollars"><div class="item-title">Coin Cache</div><div class="benefit">2,000 game coins</div><div class="art"><div class="coin c1"><iconify-icon icon="solar:star-bold"></iconify-icon></div><div class="coin c2"><iconify-icon icon="solar:star-bold"></iconify-icon></div><div class="coin c3"><iconify-icon icon="solar:star-bold"></iconify-icon></div><div class="coin c4"><iconify-icon icon="solar:star-bold"></iconify-icon></div><div class="coin c5"><iconify-icon icon="solar:star-bold"></iconify-icon></div></div><div class="price">$4.99</div></button>
      </div>
    </section>
    <section class="section" aria-labelledby="adfree-heading">
      <div class="section-title" id="adfree-heading">Ad-Free</div>
      <button class="noads" aria-label="Buy Remove Interruptions for 2.99 dollars"><div class="ad-art"><div class="ad-badge">AD</div><div class="slash"></div></div><div class="ad-copy"><div class="item-title">Remove<br>Interruptions</div><div class="benefit">Keep every run moving</div></div><div class="price">$2.99</div></button>
    </section>
    <div class="footer-note">Purchases are secure and can be restored.</div>
  </div>
</body>
</html>
