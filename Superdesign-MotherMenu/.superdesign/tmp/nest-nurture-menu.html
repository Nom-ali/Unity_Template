<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nest & Nurture Main Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito+Sans:wght@700;800;900&display=swap" rel="stylesheet">
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#3b2933;font-family:"Nunito Sans",sans-serif}
    .game{position:relative;width:1600px;height:900px;overflow:hidden;color:#57362B;background:#FFF7E8}
    .wall{position:absolute;inset:0 0 108px;background:#F7B5B5}.floor{position:absolute;left:0;right:0;bottom:0;height:174px;background:#DFA170;border-top:12px solid #B8754D}
    .sun{position:absolute;right:324px;top:42px;width:105px;height:105px;border-radius:50%;background:#FFD76C;box-shadow:0 0 0 11px rgba(255,247,232,.58)}
    .window{position:absolute;top:0;right:0;width:585px;height:493px;padding:18px 22px 0;border-left:18px solid #F8DEC2;border-bottom:18px solid #F8DEC2;background:#83D6F4}.pane{position:absolute;background:#FFF7E8}.pane.v{width:18px;height:100%;left:47%}.pane.h{height:18px;width:100%;top:44%}
    .cloud{position:absolute;border-radius:80px;background:#FFF7E8;opacity:.92}.cloud.c1{width:150px;height:42px;top:123px;right:82px}.cloud.c2{width:94px;height:30px;top:184px;right:284px}.blossom{position:absolute;border-radius:50%;background:#F7B5B5;box-shadow:18px 4px #FFF7E8,-13px 15px #E9659B,6px 24px #FFF7E8}.b1{right:67px;top:260px}.b2{right:148px;top:214px}.b3{right:26px;top:324px}
    .shelf{position:absolute;left:42px;top:0;width:382px;height:470px;border-right:14px solid #A96543;background:#BE7A50;box-shadow:14px 12px 0 rgba(87,54,43,.2)}.shelf:before,.shelf:after{content:"";position:absolute;left:0;right:0;height:16px;background:#8E563B}.shelf:before{top:140px}.shelf:after{top:302px}.book{position:absolute;bottom:18px;width:43px;border-radius:7px 7px 0 0;background:#6E2A59;box-shadow:inset -8px 0 rgba(0,0,0,.13)}.book.a{left:28px;height:101px;background:#E9659B}.book.b{left:77px;height:78px;background:#83D6F4}.book.c{left:126px;height:110px;background:#FFD76C}.book.d{left:178px;height:86px;background:#8CC9A2}.book.e{left:229px;height:118px;background:#6E2A59}.plant{position:absolute;top:175px;left:252px;width:92px;height:105px;border-radius:50% 8% 50% 8%;background:#4A9B68;box-shadow:-35px 29px #8CC9A2,25px 37px #4A9B68}.pot{position:absolute;top:251px;left:265px;width:75px;height:43px;border-radius:6px 6px 18px 18px;background:#F5AE31;border:5px solid #57362B}
    .chair{position:absolute;left:170px;bottom:115px;width:445px;height:302px;border-radius:180px 180px 70px 70px;background:#8CC9A2;border:11px solid #57362B;box-shadow:0 16px 0 rgba(87,54,43,.23)}.chair:before{content:"";position:absolute;left:53px;bottom:0;width:290px;height:148px;border-radius:110px 110px 45px 45px;background:#B9E7C8;border:9px solid #57362B}.blanket{position:absolute;left:307px;bottom:103px;width:286px;height:135px;border:9px solid #57362B;border-radius:58px;background:#F7B5B5;box-shadow:35px 21px #E9659B}.cat{position:absolute;left:231px;bottom:165px;width:172px;height:104px;border:8px solid #57362B;border-radius:88px;background:#FFF7E8;z-index:1}.cat:before,.cat:after{content:"";position:absolute;top:-40px;width:50px;height:55px;background:#FFF7E8;border:8px solid #57362B}.cat:before{left:20px;transform:rotate(-23deg);border-radius:50px 8px 45px 10px}.cat:after{right:20px;transform:rotate(23deg);border-radius:8px 50px 10px 45px}.cat-eyes{position:absolute;left:48px;top:37px;width:78px;height:12px;border-bottom:6px solid #57362B;border-radius:0 0 30px 30px}.heart{position:absolute;color:#E9659B;text-shadow:0 3px 0 #57362B;font-size:42px}.h1{left:577px;top:177px}.h2{right:315px;top:297px;font-size:30px}.h3{right:130px;top:404px;font-size:25px}
    .currency{position:absolute;z-index:4;top:26px;right:37px;display:flex;align-items:center;gap:13px;height:67px;padding:8px 11px 8px 8px;border:4px solid #57362B;border-radius:36px;background:#6E2A59;box-shadow:0 7px 0 rgba(87,54,43,.24);color:#FFF7E8;font-size:31px;font-weight:900}.token{display:grid;place-items:center;width:53px;height:53px;border:4px solid #57362B;border-radius:50%;background:#FFD76C;color:#F5AE31}.token iconify-icon{font-size:32px}.plus{display:grid;place-items:center;width:48px;height:48px;border:4px solid #57362B;border-radius:50%;background:#4A9B68;color:#FFF7E8;font-size:37px;font-weight:900;line-height:1}
    .content{position:absolute;z-index:2;left:620px;right:36px;top:111px;bottom:60px;display:flex;flex-direction:column;align-items:center}.brand{width:100%;text-align:center}.eyebrow{margin-bottom:-9px;color:#6E2A59;font-size:23px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.title{font-family:"Baloo 2",sans-serif;font-size:92px;font-weight:800;line-height:.78;letter-spacing:-2px;color:#E9659B;text-shadow:-4px -4px 0 #FFF7E8,4px -4px 0 #FFF7E8,-4px 4px 0 #FFF7E8,4px 4px 0 #FFF7E8,0 9px 0 #6E2A59,0 13px 18px rgba(87,54,43,.23)}.title span{display:block;margin-top:19px;color:#6E2A59;font-size:62px;text-shadow:-3px -3px 0 #FFF7E8,3px -3px 0 #FFF7E8,-3px 3px 0 #FFF7E8,3px 3px 0 #FFF7E8,0 6px 0 #E9659B}.tagline{margin:29px 0 22px;color:#57362B;font-family:"Baloo 2",sans-serif;font-size:25px;font-weight:700;letter-spacing:1px}.tagline:before,.tagline:after{content:"✦";color:#F5AE31;margin:0 16px}
    button{font:inherit;cursor:pointer}.play{position:relative;display:flex;align-items:center;justify-content:center;gap:28px;width:368px;height:114px;border:5px solid #57362B;border-radius:57px;background:#FFD76C;color:#57362B;box-shadow:0 11px 0 #D08022, inset 0 10px 0 rgba(255,255,255,.46);font-family:"Baloo 2",sans-serif;font-size:66px;font-weight:800;line-height:1;text-shadow:0 3px 0 rgba(255,247,232,.72)}.play:active,.tile:active,.plus:active{transform:translateY(5px);box-shadow:none}.play iconify-icon{color:#E9659B;font-size:61px;filter:drop-shadow(0 3px 0 #6E2A59)}.floating{position:absolute;right:-31px;top:-24px;width:54px;height:54px;border:4px solid #57362B;border-radius:50% 50% 50% 12px;background:#E9659B;transform:rotate(-21deg)}
    .menu-row{display:grid;grid-template-columns:repeat(6,1fr);gap:15px;width:100%;margin-top:auto}.tile{position:relative;min-height:168px;padding:12px 7px 47px;border:4px solid #57362B;border-radius:23px;background:#FFF7E8;box-shadow:0 9px 0 rgba(87,54,43,.32);color:#57362B}.tile iconify-icon{font-size:72px;filter:drop-shadow(0 4px 0 rgba(87,54,43,.23))}.tile-label{position:absolute;right:-4px;bottom:-4px;left:-4px;display:flex;align-items:center;justify-content:center;height:45px;border:4px solid #57362B;border-radius:0 0 20px 20px;color:#FFF7E8;font-family:"Baloo 2",sans-serif;font-size:21px;font-weight:800;white-space:nowrap}.pink .tile-label{background:#E9659B}.sky .tile-label{background:#4A9B68}.gold .tile-label{background:#F5AE31}.plum .tile-label{background:#6E2A59}.sage .tile-label{background:#4A9B68}.coral .tile-label{background:#C65A68}.pink iconify-icon{color:#E9659B}.sky iconify-icon{color:#83D6F4}.gold iconify-icon{color:#F5AE31}.plum iconify-icon{color:#6E2A59}.sage iconify-icon{color:#4A9B68}.coral iconify-icon{color:#E9659B}
  </style>
</head>
<body>
  <div class="game">
    <div class="wall"></div><div class="floor"></div><div class="sun"></div><div class="window"><div class="pane v"></div><div class="pane h"></div></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="blossom b1"></div><div class="blossom b2"></div><div class="blossom b3"></div>
    <div class="shelf"><div class="book a"></div><div class="book b"></div><div class="book c"></div><div class="book d"></div><div class="book e"></div><div class="plant"></div><div class="pot"></div></div><div class="chair"></div><div class="blanket"></div><div class="cat"><div class="cat-eyes"></div></div>
    <div class="heart h1">♥</div><div class="heart h2">♥</div><div class="heart h3">♥</div>
    <div class="currency"><span class="token"><iconify-icon icon="solar:star-bold"></iconify-icon></span><span>1,250</span><button class="plus" aria-label="Add tokens">+</button></div>
    <main class="content">
      <div class="brand"><div class="eyebrow">Your cozy little adventure</div><div class="title">Nest &amp; Nurture<span>Storytime</span></div><div class="tagline">Care, grow, and celebrate small moments</div></div>
      <button class="play" aria-label="Play Nest and Nurture"><iconify-icon icon="solar:play-circle-bold"></iconify-icon><span>Play</span><i class="floating"></i></button>
      <nav class="menu-row" aria-label="Main menu">
        <button class="tile pink" aria-label="Open Boutique"><iconify-icon icon="solar:shop-2-bold"></iconify-icon><span class="tile-label">Boutique</span></button>
        <button class="tile sky" aria-label="Open Settings"><iconify-icon icon="solar:settings-bold"></iconify-icon><span class="tile-label">Settings</span></button>
        <button class="tile gold" aria-label="Open Milestones"><iconify-icon icon="solar:star-fall-bold"></iconify-icon><span class="tile-label">Milestones</span></button>
        <button class="tile plum" aria-label="Open More Stories"><iconify-icon icon="solar:gamepad-bold"></iconify-icon><span class="tile-label">More Stories</span></button>
        <button class="tile sage" aria-label="Open Support"><iconify-icon icon="solar:chat-round-dots-bold"></iconify-icon><span class="tile-label">Support</span></button>
        <button class="tile coral" aria-label="Open Privacy"><iconify-icon icon="solar:shield-check-bold"></iconify-icon><span class="tile-label">Privacy</span></button>
      </nav>
    </main>
  </div>
</body>
</html>
